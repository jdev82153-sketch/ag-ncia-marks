<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Agência Marks</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080304;--card:#140d0e;--field:#1c1617;--line:#2a2022;--text:#fff;--muted:#8d8688;--orange:#f07a3c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px}
.logo{font:600 20px Poppins,sans-serif}.logo b{color:var(--orange)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
h1{font:500 22px Poppins,sans-serif;margin:0 0 4px}
h2{font:500 16px Poppins,sans-serif;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
input,select{width:100%;height:40px;border:1px solid transparent;border-radius:8px;background:var(--field);color:var(--text);font:400 13px Inter,sans-serif;padding:0 12px;outline:none}
input:focus-visible,select:focus-visible{border-color:var(--orange)}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
.btn{height:40px;padding:0 18px;border:0;border-radius:8px;background:var(--orange);color:#fff;font:500 13px Inter,sans-serif;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--orange)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.msg{min-height:18px;margin:10px 0 0;font-size:12px;color:#ff9a8a}
.ok{color:#7ddc9a}
.rolagem{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:0}
.acoes{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--field)}
.tag.on{color:#7ddc9a}.tag.off{color:#ff9a8a}
.nova{background:var(--field);border:1px dashed var(--orange);border-radius:8px;padding:12px;margin-top:14px;word-break:break-all;display:none}
.nova code{color:var(--orange);font-size:14px}
#login{max-width:360px;margin:12vh auto 0}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

  <section id="login" class="card">
    <div class="logo" style="margin-bottom:14px">Agência <b>Marks</b></div>
    <h1>Administração</h1>
    <p style="color:var(--muted);margin:0 0 16px">Acesso só para o administrador.</p>
    <form id="fLogin" novalidate>
      <label for="email">E-mail</label>
      <input id="email" type="text" autocomplete="username" style="margin-bottom:12px">
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password">
      <p class="msg" id="mLogin" role="alert"></p>
      <button class="btn" type="submit" style="margin-top:6px">Entrar</button>
    </form>
  </section>

  <section id="painel" class="hide">
    <div class="top">
      <div class="logo">Agência <b>Marks</b> <span style="color:var(--muted);font:400 13px Inter,sans-serif">| Admin</span></div>
      <button class="btn ghost sm" id="sair">Sair</button>
    </div>

    <div class="card">
      <h2>Nova empresa</h2>
      <form id="fNova" novalidate>
        <div class="grid">
          <div><label for="nome">Nome da empresa</label><input id="nome" type="text" autocomplete="off"></div>
          <div><label for="nicho">Nicho</label><select id="nicho"></select></div>
          <div><button class="btn" type="submit" style="width:100%">Criar empresa e key</button></div>
        </div>
      </form>
      <p class="msg" id="mNova" role="alert"></p>
      <div class="nova" id="novaBox">
        Empresa criada. Key de acesso (mostrada agora para você copiar):<br>
        <code id="novaKey"></code><br>
        <button class="btn sm" id="copiarNova" style="margin-top:8px">Copiar key</button>
      </div>
    </div>

    <div class="card">
      <h2>Empresas</h2>
      <div class="rolagem">
        <table>
          <thead><tr><th>Empresa</th><th>Nicho</th><th>Status</th><th>Ações</th></tr></thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
      <p class="msg" id="mLista" role="alert"></p>
    </div>
  </section>
</div>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
